name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Packs every publishable package the way the release job does and
      # inspects the tarball (no `development` condition, no `workspace:`
      # ranges, only dist/README/LICENSE). See scripts/verify-pack.ts.
      - name: Verify publish tarballs
        run: bun run verify:pack

  # Which paths changed — gates the MySQL integration job on PRs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - "packages/server/**"
              - "packages/core/**"
              - "bun.lock"
              - ".github/workflows/ci.yml"

  # Real MySQL 8.4 (testcontainers; ubuntu runners ship Docker). Always on push
  # to main; on PRs only when packages/server or packages/core changed.
  server-integration:
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (needs.changes.result == 'success' && needs.changes.outputs.server == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull mysql:8.4
        run: docker pull mysql:8.4

      - name: MySQL integration tests
        run: bun run test:integration

  # Server against the ends of its drizzle-orm peer range (spec v0.2 §C9):
  # pins each version into packages/server and runs typecheck + unit suite.
  # `--in-place` rewrites package.json/bun.lock — fine on a throwaway checkout.
  drizzle-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        drizzle: ["0.41.0", "0.45"]
    name: drizzle-matrix (drizzle-orm@${{ matrix.drizzle }})
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Server typecheck + unit tests on drizzle-orm@${{ matrix.drizzle }}
        run: bun scripts/drizzle-matrix.ts --in-place ${{ matrix.drizzle }}

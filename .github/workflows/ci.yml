name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Which paths changed — gates the MySQL integration job on PRs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - "packages/server/**"
              - "packages/core/**"
              - "bun.lock"
              - ".github/workflows/ci.yml"

  # Real MySQL 8.4 (testcontainers; ubuntu runners ship Docker). Always on push
  # to main; on PRs only when packages/server or packages/core changed.
  server-integration:
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (needs.changes.result == 'success' && needs.changes.outputs.server == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull mysql:8.4
        run: docker pull mysql:8.4

      - name: MySQL integration tests
        run: bun run test:integration

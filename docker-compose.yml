# Local MySQL for apps/demo-api. `bun run db:up` / `bun run db:down`.
services:
  mysql:
    image: mysql:8.4
    container_name: schema-grid-mysql
    environment:
      MYSQL_ROOT_PASSWORD: schema_grid
      MYSQL_DATABASE: schema_grid
      MYSQL_USER: schema_grid
      MYSQL_PASSWORD: schema_grid
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pschema_grid"]
      interval: 3s
      timeout: 3s
      retries: 40
